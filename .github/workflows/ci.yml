# SPDX-License-Identifier: MIT
name: CI

# Run by hand only (Actions → CI → Run workflow), like JustVoice's — the user, 2026-10-17: "it
# should be onluy run by hand", and "your rec on all go" on doing the same here.
on:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
